[keys]
prefix = "alt+o"
help = "prefix+?"
detach = "prefix+d"
workspace_picker = "prefix+s"
goto = ["prefix+f", "prefix+w"]
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+$"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
move_tab_previous = "prefix+shift+left"
move_tab_next = "prefix+shift+right"
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"
copy_mode = "prefix+["
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
swap_pane_up = "prefix+{"
swap_pane_down = "prefix+}"
last_pane = "prefix+semicolon"
cycle_pane_next = "prefix+o"
split_vertical = "prefix+percent"
split_horizontal = "prefix+double_quote"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_pane_left = ["prefix+ctrl+left", "prefix+alt+left"]
resize_pane_down = ["prefix+ctrl+down", "prefix+alt+down"]
resize_pane_up = ["prefix+ctrl+up", "prefix+alt+up"]
resize_pane_right = ["prefix+ctrl+right", "prefix+alt+right"]

[theme]
name = "terminal"
auto_switch = false

[ui]
mouse_capture = false

[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]
